set -g prefix C-q
set -g mouse on


# Start window and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1


# Use Shift-arrow keys to switch panes
bind -n S-Left select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up select-pane -U
bind -n S-Down select-pane -D


# Set easier window split keys
bind-key v split-window -h
bind-key h split-window -v

# Use Ctrl + Alt + Arrow keys to switch windows (instead of Shift)
bind -n M-C-Left  previous-window
bind -n M-C-Right next-window


# Alias ks to kill the current session
set -s command-alias[100] ks='kill-session'

# Easily reorder windows with CTRL+SHIFT+Arrow
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1


# -------------------------------------------------------------------
# Status Bar Styling (Matches the Image Theme)
# -------------------------------------------------------------------

# Turn the status bar on and set the refresh interval
set -g status on
set -g status-interval 1

# Overall status bar background and foreground
set -g status-style "bg=#282828,fg=#eee8d5"

# Position alignment
set -g status-justify centre

# -------------------------------------------------------------------
# Left Side: Green Session Indicator
# -------------------------------------------------------------------
# Features the λ symbol, session number, and a powerline arrow
set -g status-left-length 60
set -g status-left "#[bg=#a6e3a1,fg=#1e1e2e,bold] λ #S #[bg=#282828,fg=#a6e3a1,nobold]"

# -------------------------------------------------------------------
# Middle: Purple Active Window Indicator
# -------------------------------------------------------------------
# Unfocused windows (subtle text)
setw -g window-status-format "#[fg=#665c54,bg=#282828] #I:#W "

# Focused/Active window (Purple block matching the image)
setw -g window-status-current-format "#[bg=#cba6f7,fg=#1e1e2e,bold] #I:#W "

# -------------------------------------------------------------------
# Right Side: Blue Date, Time, and Mail/Notification counter
# -------------------------------------------------------------------
set -g status-right-length 150
# Matches the right side: (4) count, calendar date, and clock
set -g status-right "#[fg=#89b4fa,bg=#282828] (%h) #[bg=#89b4fa,fg=#1e1e2e,bold] 📅 %Y-%m-%d  🕒 %H:%M "

# -------------------------------------------------------------------
# Window Pane Borders (Optional: matches the theme colors)
# -------------------------------------------------------------------
# set -g pane-border-style "fg=#3c3836"
# set -g pane-active-border-style "fg=#cba6f7"
set -g pane-active-border-style "fg=#a6e3a1"

